name: Tips Ledger - Isolated Backup Restore Rehearsal

# This workflow never connects to the live Supabase database. It only reads
# encrypted archives from R2 and restores payment tables into a disposable,
# network-isolated PostgreSQL container on the Actions runner.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tips-ledger-restore-rehearsal
  cancel-in-progress: false

jobs:
  restore-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned crypto and R2 dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/backup-requirements.txt
      - name: Check existing backup parser tests
        run: python -m unittest discover -s tests -p 'test_backup_*.py' -v
      - name: Validate upgraded SheetJS Excel export (no secrets)
        run: |
          curl -fsSL --retry 2 --max-time 30 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js' -o /tmp/tl-xlsx.full.min.js
          node -e "const x=require('/tmp/tl-xlsx.full.min.js');const ws=x.utils.aoa_to_sheet([['Week','Tips'],['Test',10]]);const wb=x.utils.book_new();x.utils.book_append_sheet(wb,ws,'Tips');const out=x.write(wb,{bookType:'xlsx',type:'buffer'});if(x.version!=='0.20.3'||!out||out.length<100)process.exit(1);console.log('SheetJS export smoke test passed');"
      - name: Restore archived payment tables to an isolated disposable database
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/restore_rehearsal.py
