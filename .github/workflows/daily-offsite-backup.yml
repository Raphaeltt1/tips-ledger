name: Tips Ledger - Encrypted Daily Offsite Backup

# First encrypted R2 backup was successfully exported, uploaded, downloaded,
# decrypted, and verified in the manual run on 2026-10-31.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *' # Every day at 11 PM Lebanon local time.
      timezone: 'Asia/Beirut' # Automatically follows Lebanese daylight-saving time.

permissions:
  contents: read

concurrency:
  group: tips-ledger-offsite-backup
  cancel-in-progress: false

jobs:
  backup:
    # Nightly scheduling is active following the verified manual backup.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout approved app repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned backup dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/backup-requirements.txt
      - name: Validate database URI parser (no network or credentials)
        run: python -m unittest discover -s tests -p 'test_backup_*.py' -v
      - name: Validate configuration, export, encrypt, and verify R2 backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/daily_offsite_backup.py
