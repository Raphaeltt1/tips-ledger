name: One-time orphan profile photo cleanup

on:
  workflow_dispatch:
  push:
    branches:
      - one-time-orphan-avatar-cleanup-20261031

permissions:
  contents: read

jobs:
  orphan-avatar-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify cleanup script
        run: deno check scripts/cleanup_orphan_avatars_once.ts
      - name: Remove exactly two verified orphan photos through Supabase Storage
        run: |
          python - <<'PY'
          import json, urllib.request
          url='https://qvwgmybocjyhldwnrqqt.supabase.co/functions/v1/cleanup-avatars-3d2a7f4a9cbb816f5961a31a364ce9c4'
          payload=json.dumps({'mode':'delete'}).encode()
          req=urllib.request.Request(url,data=payload,headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=30) as res:
              obj=json.load(res)
          if obj.get('ok') is not True or obj.get('phase')!='deleted' or obj.get('orphanPhotosDeleted')!=2 or obj.get('superuserPhotoSafe') is not True:
              raise SystemExit('The exact two-file cleanup did not complete')
          print('Two orphaned photos removed through Storage API; Superuser photo preserved.')
          PY
