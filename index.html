<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tips Ledger — Demo</title><style>body{font:16px system-ui;background:#f4f6fa;color:#17233b;margin:0}header{background:#17233b;color:white;padding:22px}main{max-width:850px;margin:auto;padding:20px}.card{background:white;border-radius:14px;padding:20px;margin:15px 0;box-shadow:0 3px 14px #0001}input,select,button{font:inherit;padding:10px;margin:5px;border:1px solid #cbd3df;border-radius:8px}button{background:#1768d2;color:white;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}.muted{color:#667}nav button{background:#fff;color:#17233b}.hidden{display:none}</style><header><h2>Tips Ledger <small>Prototype</small></h2><nav><button onclick="view('admin')">Admin</button><button onclick="view('manager')">Manager</button><button onclick="view('runner')">Runner</button></nav></header><main><p class="muted">Local demo only: role switching is not authentication. Data stays in this browser.</p><section id="admin" class="card"><h2>Admin · Runner setup</h2><input id="name" placeholder="Runner name"><input id="rate" type="number" step=".01" placeholder="Hourly rate"><button onclick="addRunner()">Add runner</button><div id="people"></div><h3>Weekly records</h3><div id="all"></div></section><section id="manager" class="card hidden"><h2>Manager · Weekly tips</h2><select id="runnerSelect"></select><input id="week" type="date"><input id="hours" type="number" step=".25" placeholder="Hours"><input id="gross" type="number" step=".01" placeholder="Total tips $"><input id="advance" type="number" step=".01" placeholder="Advance $"><button onclick="addRecord()">Publish weekly tips</button><p class="muted">Published entries are locked in this demo.</p></section><section id="runner" class="card hidden"><h2>Runner · My Tips History</h2><select id="historyRunner" onchange="render()"></select><label>From <input type="date" id="from" onchange="render()"></label><label>To <input type="date" id="to" onchange="render()"></label><div id="history"></div></section></main><script>const key='tips-ledger-demo-v1';let state=JSON.parse(localStorage.getItem(key)||'{"runners":[],"records":[]}');const $=id=>document.getElementById(id),money=n=>'$'+Number(n).toFixed(2),save=()=>{localStorage.setItem(key,JSON.stringify(state));render()};function view(id){for(let x of ['admin','manager','runner'])$(x).classList.toggle('hidden',x!==id)}function addRunner(){let name=$('name').value.trim(),rate=Number($('rate').value);if(!name||!(rate>0))return alert('Enter a name and valid rate');state.runners.push({id:crypto.randomUUID(),name,rate});$('name').value='';$('rate').value='';save()}function addRecord(){let id=$('runnerSelect').value,week=$('week').value,hours=Number($('hours').value),gross=Number($('gross').value),advance=Number($('advance').value);if(!id||!week||!Number.isFinite(hours)||hours<0||gross<0||advance<0||advance>gross||!$('hours').value||!$('gross').value||!$('advance').value)return alert('Check all fields. Advance cannot exceed tips.');if(state.records.some(x=>x.id===id&&x.week===week))return alert('This week is already published');let rate=state.runners.find(x=>x.id===id).rate;state.records.push({id,week,hours,gross,advance,net:gross-advance,rate,confirmedAt:null});save();alert('Published. Runner can now view the amount.')}function confirmRecord(id,week){let r=state.records.find(x=>x.id===id&&x.week===week);if(r&&!r.confirmedAt&&confirm('Confirm you received '+money(r.net)+'?')){r.confirmedAt=new Date().toISOString();save()}}function render(){let opts=state.runners.map(r=>`<option value="${r.id}">${r.name.replaceAll('<','&lt;')}</option>`).join('');for(let id of ['runnerSelect','historyRunner']){let old=$(id).value;$(id).innerHTML=opts;if(state.runners.some(r=>r.id===old))$(id).value=old}$('people').innerHTML=state.runners.map(r=>`<p>${r.name.replaceAll('<','&lt;')} — Rate ${money(r.rate)}/hour</p>`).join('');$('all').innerHTML=table(state.records);let id=$('historyRunner').value,rs=state.records.filter(r=>r.id===id&&(!$('from').value||r.week>=$('from').value)&&(!$('to').value||r.week<=$('to').value));$('history').innerHTML=`<p><b>Total tips:</b> ${money(rs.reduce((a,r)=>a+r.gross,0))} · <b>Advances:</b> ${money(rs.reduce((a,r)=>a+r.advance,0))} · <b>Net:</b> ${money(rs.reduce((a,r)=>a+r.net,0))} · <b>Hours:</b> ${rs.reduce((a,r)=>a+r.hours,0)}</p>`+table(rs,true)}function table(rows,runner=false){return `<div style="overflow-x:auto"><table><tr><th>Week</th><th>Runner</th><th>Hours</th><th>Rate</th><th>Tips</th><th>Advance</th><th>Net</th><th>Status</th></tr>${rows.map(r=>`<tr><td>${r.week}</td><td>${state.runners.find(x=>x.id===r.id)?.name||''}</td><td>${r.hours}</td><td>${money(r.rate)}</td><td>${money(r.gross)}</td><td>${money(r.advance)}</td><td>${money(r.net)}</td><td>${r.confirmedAt?'Received':runner?`<button onclick="confirmRecord('${r.id}','${r.week}')">Confirm receipt</button>`:'Pending'}</td></tr>`).join('')}</table></div>`}render()</script></html>
